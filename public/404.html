<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GreenCampus AI — Redirecting</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      sessionStorage.redirect = location.href;
      var path = window.location.pathname;
      var repo = path.split('/')[1];
      if (repo && !repo.includes('.')) {
        window.location.replace('/' + repo + '/');
      } else {
        window.location.replace('/');
      }
    </script>
    <meta http-equiv="refresh" content="0; URL='./index.html'" />
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 50px; background-color: #f8faf9; color: #0f172a;">
    <h2>Redirecting to GreenCampus AI...</h2>
    <p><a href="./index.html" style="color: #059669; font-weight: 600;">Click here if you are not redirected automatically.</a></p>
  </body>
</html>
